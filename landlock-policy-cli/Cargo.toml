[package]
name = "landlock-policy-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Landlock policy development, inspection, and transformation tool"
homepage = "https://landlock.io"
repository = "https://github.com/landlock-lsm/landlockconfig"
license.workspace = true
keywords = ["landlock", "security", "sandbox", "json", "toml"]
categories = ["command-line-utilities", "config", "os::linux-apis"]
exclude = [".gitignore"]

[dependencies]
clap = { version = "4.5.28", features = ["derive"] }

[[bin]]
name = "landlock-policy"
path = "src/main.rs"
doc = false
