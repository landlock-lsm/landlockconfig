abi = 5

# The omitted ruleset defaults to all rights supported by ABI 5.

# Main system directories can be read.
[[path_beneath]]
allowed_access = ["abi.read_execute"]
parent = [".", "/bin", "/lib", "/usr", "/dev", "/etc", "/proc",]

# Only allow writing to /tmp.
[[path_beneath]]
allowed_access = ["abi.read_write"]
parent = ["/tmp"]
